---
# Configure the confd and hiavd service instances that serve one HA cluster on
# the witness. The ha-witness RPM ships both the default services (instance 0:
# confd.service, hiavd.service) and instance templates (confd@.service,
# hiavd@.service). See the multi-cluster witness section of group_vars/all for
# how instance numbers map to ports and file locations.
- name: Configure witness instance {{ witness_instance_id }} for the {{ role }} cluster
  block:
    - name: Verify witness instance matches the {{ role }} HA pair
      ansible.builtin.assert:
        that:
          - (hostvars[groups[role][0]].witness_instance | default(0) | int) == (witness_instance_id | int)
          - (hostvars[groups[role][1]].witness_instance | default(0) | int) == (witness_instance_id | int)
        fail_msg: >-
          witness_instance for {{ inventory_hostname }} ({{ witness_instance_id }})
          must match witness_instance of the {{ role }} group in the inventory.
        quiet: true

    # Earlier revisions of this playbook installed custom units named
    # confd-<name>.service and hiavd-<name>.service and disabled the default
    # services. Those units never worked because -instance takes an integer.
    - name: Remove legacy custom witness units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.0 }}{{ item.1 }}-{{ role }}.service"
        state: absent
      loop: "{{ ['', 'multi-user.target.wants/'] | product(['confd', 'hiavd']) | list }}"
      register: legacy_witness_units_result

    - name: Reload systemd after removing legacy units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: legacy_witness_units_result is changed

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Open witness instance ports in firewalld
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - "{{ ha_comms_port }}"
        - "{{ confd_client_port }}"
        - "{{ confd_peer_port }}"
      when: ansible_facts.services.get('firewalld.service', {}).get('state') == 'running'

    - name: Enable and start {{ confd_service }} and {{ hiavd_service }}
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - "{{ confd_service }}"
        - "{{ hiavd_service }}"
