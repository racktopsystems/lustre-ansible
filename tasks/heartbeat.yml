---
# The heartbeat link is the physical interface named by `hb_iface`. It is
# carried by a NetworkManager connection named `hb_conn_name` (hb0). An existing
# connection for that interface is renamed to hb0 rather than duplicated.
- name: Setup HA heartbeat ({{ hb_conn_name }}) connection on {{ hb_iface | default('undefined') }}
  block:
    - name: Validate heartbeat interface variables
      ansible.builtin.assert:
        that:
          - hb_iface is defined
          - hb_iface in ansible_interfaces
          - hb_iface_ipaddr is defined
          - hb_iface_ipaddr is ipv4_cidr
        fail_msg: >-
          hb_iface ({{ hb_iface | default('undefined') }}) must name an existing
          interface ({{ ansible_interfaces | sort | join(', ') }}) and
          hb_iface_ipaddr ({{ hb_iface_ipaddr | default('undefined') }}) must be
          an IPv4 address in CIDR form (e.g. 192.255.0.1/24).
        quiet: true

    - name: List NetworkManager connections
      ansible.builtin.shell: |
        set -eu
        active=$(nmcli -g GENERAL.CON-UUID device show {{ hb_iface | quote }} 2>/dev/null || true)
        for u in $(nmcli -g UUID connection show); do
          id=$(nmcli -g connection.id connection show uuid "$u")
          ifn=$(nmcli -g connection.interface-name connection show uuid "$u")
          [ "$u" = "$active" ] && act=1 || act=0
          printf '%s\t%s\t%s\t%s\n' "$u" "$act" "$ifn" "$id"
        done
      register: hb_nm_conns
      changed_when: false
      check_mode: false

    - name: Select the connection to use as {{ hb_conn_name }}
      vars:
        conns: "{% set ns = namespace(l=[]) %}{% for l in hb_nm_conns.stdout_lines %}{% set f = l.split('\t', 3) %}{% set ns.l = ns.l + [{'uuid': f[0], 'active': f[1] == '1', 'ifname': f[2], 'id': f[3]}] %}{% endfor %}{{ ns.l }}"
        named: "{{ conns | selectattr('id', 'equalto', hb_conn_name) | list }}"
        on_dev_active: "{{ conns | selectattr('active') | list }}"
        on_dev_bound: "{{ conns | selectattr('ifname', 'equalto', hb_iface) | list }}"
      ansible.builtin.set_fact:
        hb_conn_dup_count: "{{ named | length }}"
        hb_conn_current: "{{ (named + on_dev_active + on_dev_bound + [{}]) | first }}"

    - name: Ensure only one connection is named {{ hb_conn_name }}
      ansible.builtin.assert:
        that: hb_conn_dup_count | int <= 1
        fail_msg: "Multiple NetworkManager connections are named {{ hb_conn_name }}; remove the extras."
        quiet: true

    - name: Rename connection '{{ hb_conn_current.id | default('') }}' to {{ hb_conn_name }}
      ansible.builtin.command:
        argv: [nmcli, connection, modify, uuid, "{{ hb_conn_current.uuid }}", connection.id, "{{ hb_conn_name }}"]
      register: hb_conn_rename
      when:
        - hb_conn_current.uuid is defined
        - hb_conn_current.id != hb_conn_name

    - name: Configure {{ hb_conn_name }} on {{ hb_iface }} with {{ hb_iface_ipaddr }}
      community.general.nmcli:
        conn_name: "{{ hb_conn_name }}"
        ifname: "{{ hb_iface }}"
        type: ethernet
        method4: manual
        ip4: "{{ hb_iface_ipaddr }}"
        autoconnect: true
        state: present
      register: hb_conn_config

    - name: Activate {{ hb_conn_name }}
      ansible.builtin.command:
        argv: [nmcli, connection, up, id, "{{ hb_conn_name }}"]
      when: >-
        (hb_conn_rename is changed) or (hb_conn_config is changed) or
        not (hb_conn_current.active | default(false))
