---
# Configure keymgrd on the Lustre servers (the oss and mds HA pairs) to use a
# KMIP key manager. Imported by global-playbook.yml after registration, for
# the HA nodes only.
#
# 1. Installs each server's KMIP certificates from the repository:
#      inputs/keymgr/<inventory name>/certauth.pem   (CA certificate)
#      inputs/keymgr/<inventory name>/clientkey.pem  (client private key)
#      inputs/keymgr/<inventory name>/clientcert.pem (client certificate)
#    to /etc/racktop/keymgrd/ on that server.
# 2. Sets Type, KmipHost and KmipZone in /etc/racktop/keymgrd/keymgrd.conf
#    from kmip_type (default Fornetix, the keymgrd type for a KMIP key
#    manager), kmip_host and kmip_zone, set
#    under `all: vars:` in the inventory. Every other setting in the file is
#    left as it is.
#
# Nothing is done while neither kmip_host nor kmip_zone is set, so
# sites without a key manager are unaffected; setting only one of them stops
# the run. A server without all three certificate files in the repository is
# skipped, with a note saying which are missing, and left unchanged. keymgrd is restarted (handler "Restart keymgrd") when any of these
# change.

- name: Report that the key manager is not configured
  ansible.builtin.debug:
    msg: >-
      kmip_host and kmip_zone are not set, so keymgrd is left
      unchanged. Set both under `all: vars:` in the inventory to configure it.
  when:
    - kmip_host is not defined
    - kmip_zone is not defined

- name: Configure keymgrd for KMIP
  when: kmip_host is defined or kmip_zone is defined
  vars:
    keymgr_conf_dir: /etc/racktop/keymgrd
    keymgr_config_file: "{{ keymgr_conf_dir }}/keymgrd.conf"
    keymgr_inputs_dir: "{{ playbook_dir }}/inputs/keymgr/{{ inventory_hostname }}"
    keymgr_files:
      - {name: certauth.pem, mode: "0644"}
      - {name: clientkey.pem, mode: "0600"}
      - {name: clientcert.pem, mode: "0644"}
  block:
    - name: Validate the key manager settings
      ansible.builtin.assert:
        that:
          - kmip_host is defined
          - kmip_host | string | trim | length > 0
          - kmip_zone is defined
          - kmip_zone | string | trim | length > 0
        fail_msg: >-
          Set both kmip_host (the key manager's hostname or IP address) and
          kmip_zone under `all: vars:` in the inventory.
        quiet: true

    - name: Check for this server's certificate files in the repository
      ansible.builtin.set_fact:
        keymgr_missing_files: >-
          {{ keymgr_files | map(attribute='name')
             | reject('in', keymgr_present_files) | list }}
      vars:
        keymgr_present_files: >-
          {{ keymgr_files | map(attribute='name')
             | map('regex_replace', '^', keymgr_inputs_dir ~ '/')
             | select('file') | map('basename') | list }}

    - name: Report a server skipped for lack of certificate files
      ansible.builtin.debug:
        msg: >-
          Skipping keymgrd on {{ inventory_hostname }}: inputs/keymgr/{{
          inventory_hostname }}/ lacks {{ keymgr_missing_files | join(', ') }}.
          Add certauth.pem, clientkey.pem and clientcert.pem there to configure it.
      when: keymgr_missing_files | length > 0

    - name: Ensure {{ keymgr_conf_dir }} exists
      ansible.builtin.file:
        path: "{{ keymgr_conf_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: keymgr_missing_files | length == 0

    - name: Install the KMIP certificate files
      ansible.builtin.copy:
        src: "{{ keymgr_inputs_dir }}/{{ item.name }}"
        dest: "{{ keymgr_conf_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop: "{{ keymgr_files }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Restart keymgrd
      when: keymgr_missing_files | length == 0

    # Values are written as quoted strings; to_json escapes any quotes or
    # backslashes the way the config file's string syntax expects.
    - name: Set the key manager in {{ keymgr_config_file }}
      ansible.builtin.lineinfile:
        path: "{{ keymgr_config_file }}"
        regexp: '^\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value | string | trim | to_json }}"
      loop:
        - {key: Type, value: "{{ kmip_type | default('Fornetix') }}"}
        - {key: KmipHost, value: "{{ kmip_host }}"}
        - {key: KmipZone, value: "{{ kmip_zone }}"}
      loop_control:
        label: "{{ item.key }}"
      notify: Restart keymgrd
      when: keymgr_missing_files | length == 0
