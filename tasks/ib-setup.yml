---
- name: Validate InfiniBand addresses are in CIDR form
  ansible.builtin.assert:
    that: item.value is ipv4_cidr
    fail_msg: "ib_addrs.{{ item.key }} must be an IPv4 address in CIDR form (e.g. 192.168.100.11/24), got '{{ item.value }}'"
    quiet: true
  loop: "{{ ib_addrs | dict2items | selectattr('value') | list }}"
  loop_control:
    label: "{{ item.key }}"

- name: Configure InfiniBand interfaces via NetworkManager
  community.general.nmcli:
    conn_name: "{{ item.key }}"
    ifname: "{{ item.key }}"
    type: infiniband
    ip4: "{{ item.value }}"
    state: present
  loop: "{{ ib_addrs | dict2items | selectattr('value') | list }}"
  loop_control:
    label: "{{ item.key }}"
