---
# Registers the system and installs its BrickStor licenses from the
# system-specific .oreg file named by the host's `license_file` inventory
# variable. Relative paths are resolved against the repository root.
- name: Validate license_file
  ansible.builtin.assert:
    that:
      - license_file is defined
      - license_file is string
      - license_file is match('.*\.oreg$')
    fail_msg: "license_file must name this system's .oreg file (got '{{ license_file | default('undefined') }}')"
    quiet: true

- name: Gather custom registration facts
  registration_facts:

- name: Register system and install licenses
  when: not system_is_registered
  block:
    - name: Transfer {{ license_file | basename }} to the system
      ansible.builtin.copy:
        src: "{{ license_file if license_file is abs else playbook_dir ~ '/' ~ license_file }}"
        dest: "{{ license_remote_file }}"
        owner: root
        group: root
        mode: "0600"

    # --json keeps licadm non-interactive (no EULA pager or prompts) and
    # reports failures as JSON.
    - name: Apply {{ license_file | basename }} with licadm
      ansible.builtin.command:
        argv:
          - "{{ licadm_bin }}"
          - --json
          - register
          - --file
          - "{{ license_remote_file }}"
          - --eula-signer
          - "{{ license_eula_signer }}"
      register: license_register_result

    - name: Restart platform services to pick up the registration
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - acld
        - bsrapid
        - bsrbootstrapd
        - bsrlicensed
        - bsrzfsd
        - confd
        - healthd
        - hiavd
        - hwd
        - identd
        - keymgrd
        - localuserd
        - reportd
        - rtrepld
        - rtsnapd
        - secured
        - zcached
        - lustred
        - webhookd
      when: license_register_result is changed

  always:
    - name: Remove {{ license_remote_file }}
      ansible.builtin.file:
        path: "{{ license_remote_file }}"
        state: absent
