# Stennis site inventory. Values marked TODO must be confirmed before running.
# See inventory.yaml.example for documentation of each field.

# Settings for every host.
all:
  vars:
    ntp_servers:
      - time.nist.gov
      - tick.usno.navy.mil
    kmip_host: https://10.2.26.58:5696
    kmip_zone: BrickStorSPL
    # Name of the Lustre file system. The existing targets were formatted
    # as lustrefs (lustrefs-MDT0000, lustrefs-OST0000).
    filesystem_name: lustrefs

oss:
  hosts:
    ossnode1:
      ansible_host: 10.2.26.11
      license_file: inputs/registration/ZZ0001HM.oreg
      hostname: lustre-stennis-oss1
      first_ha_node: true
      ha_peer_ipaddr: 10.2.26.12
      admin_iface: ens259f0
      hb_iface: ens259f1
      hb_iface_ipaddr: 192.255.0.1/24
      ipmi_ip_address: 10.2.11.9
      configure_ipmi: false
      ib_addrs:
        ib0: 192.168.100.11/24
        ib1: null

    ossnode2:
      ansible_host: 10.2.26.12
      license_file: inputs/registration/ZZ0001HN.oreg
      hostname: lustre-stennis-oss2
      first_ha_node: false
      ha_peer_ipaddr: 10.2.26.11
      admin_iface: ens259f0
      hb_iface: ens259f1
      hb_iface_ipaddr: 192.255.0.2/24
      ipmi_ip_address: 10.2.11.13
      configure_ipmi: false
      ib_addrs:
        ib0: 192.168.100.12/24
        ib1: null
  vars:
    witness_instance: 0 # hiavd 4746, confd 2379/2380
    zpools:
      - oss01
    lustre_targets:
      - pool: oss01
        dataset: ost01
        role: ost
        # The OST was formatted as index 0 (lustrefs-OST0000); without this
        # the index would come from the dataset name (ost01 -> 1).
        index: 0

mds:
  hosts:
    mdsnode1:
      ansible_host: 10.2.26.13
      license_file: inputs/registration/ZZ0001HO.oreg
      hostname: lustre-stennis-mgs1
      first_ha_node: true
      ha_peer_ipaddr: 10.2.26.14
      admin_iface: ens259f0
      hb_iface: ens259f1
      hb_iface_ipaddr: 192.255.0.1/24
      ipmi_ip_address: 10.2.11.14
      configure_ipmi: false
      ib_addrs:
        ib0: 192.168.100.13/24
        ib1: null

    mdsnode2:
      ansible_host: 10.2.26.14
      license_file: inputs/registration/ZZ0001HP.oreg
      hostname: lustre-stennis-mgs2
      first_ha_node: false
      ha_peer_ipaddr: 10.2.26.13
      admin_iface: ens259f0
      hb_iface: ens259f1
      hb_iface_ipaddr: 192.255.0.2/24
      ipmi_ip_address: 10.2.11.15
      configure_ipmi: false
      ib_addrs:
        ib0: 192.168.100.14/24
        ib1: null
  vars:
    witness_instance: 1 # hiavd 4747, confd 2381/2382
    zpools:
      - mgs01
    lustre_targets:
      - pool: mgs01
        dataset: mgsmdt01
        role: mgsmdt
        # The file system's first MDT must be index 0; without this the
        # index would come from the dataset name (mgsmdt01 -> 1).
        index: 0

cluster_witness:
  hosts:
    witness-oss:
      ansible_host: 10.2.26.15
      hostname: lustre-stennis-witness1
      role: oss
      witness_instance: 0
    witness-mds:
      ansible_host: 10.2.26.15
      hostname: lustre-stennis-witness1
      role: mds
      witness_instance: 1

lustre_nodes:
  children:
    oss:
    mds:
    cluster_witness:
